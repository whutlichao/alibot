# 门禁的**唯一入口**是 `scripts/check.sh`；本文件只做「装环境 + 跑脚本」两件事。
#
# 为什么不在 workflow 里逐条抄命令：命令清单是缓存，抄进 workflow / 票面 / README 各一份就会
# 漂移——本仓已经吃过一次：票面门禁手列了 5 个 `*.test.cjs`，同一轮新增的 3 套前端用例就不在
# 门禁里。脚本里 Node 用例族一律走 glob，新增文件自动纳入。
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          # app/pyproject.toml 写的是 requires-python >=3.11。
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          # 20 是 Vite 7 / Vitest 4 的下限（它们的 `engines.node` 是 `^20.19 || >=22.12`）。
          node-version: "20"
          # 前端依赖按 `app/frontend/package-lock.json` 缓存（`npm ci` 的输入就是它）。
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # AgentScope 的 Grep/Glob 走真实 `rg`；runner 默认没有它，工具会返回 code 127。
      # 门禁测真实工具，所以在这里装，而不是在测试里 skip 或替换成替身。
      - name: 安装 ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      # 运行依赖 + dev extra（pytest / ruff / mypy / httpx2）；agentscope 已 pin 在 pyproject。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "app[dev]"

      # `scripts/check.sh` 按 PYRIGHT_BIN → node_modules/.bin/pyright → PATH → ~/.pi-lens
      # 依次找 pyright。runner 上既没有 `.venv` 也没有 pi-lens，所以把它装到 PATH 上。
      - name: 安装 pyright
        run: npm install --global pyright

      # 前端依赖：`scripts/check.sh` 只在缺 `node_modules` 时自己 `npm ci`，这里显式装一次
      # 是为了让依赖下载与「跑门禁」分成两步（下载失败时日志一眼看得出是哪一步）。
      # `npm ci` 严格按 lock 文件装，`--include=dev` 防止 runner 上 NODE_ENV=production 时跳过 devDependencies。
      - name: 安装前端依赖
        run: npm ci --include=dev --no-audit --no-fund
        working-directory: app/frontend

      - name: Gate（scripts/check.sh）
        # 与本地完全同一条命令。runner 上没有 `.venv`，脚本回退到 python3（上面已装好依赖）；
        # 本机 `no_proxy` 的 `[::1]` 噪声由 `app/tests/conftest.py` 的 autouse fixture 摘掉，
        # 所以 CI 与本机都不需要再写 `env -u ...`。
        run: ./scripts/check.sh
