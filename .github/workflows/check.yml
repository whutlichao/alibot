# 门禁的**唯一入口**是 `scripts/check.sh`；本文件只做「装环境 + 跑脚本」两件事。
#
# 为什么不在 workflow 里逐条抄命令：命令清单是缓存，抄进 workflow / 票面 / README 各一份就会
# 漂移——本仓已经吃过一次：票面门禁手列了 5 个 `*.test.cjs`，同一轮新增的 3 套前端用例就不在
# 门禁里。脚本里 Node 用例族一律走 glob，新增文件自动纳入。
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          # app/pyproject.toml 写的是 requires-python >=3.11。
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 运行依赖 + dev extra（pytest / ruff / mypy / httpx2）；agentscope 已 pin 在 pyproject。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "app[dev]"

      # `scripts/check.sh` 按 PYRIGHT_BIN → node_modules/.bin/pyright → PATH → ~/.pi-lens
      # 依次找 pyright。runner 上既没有 `.venv` 也没有 pi-lens，所以把它装到 PATH 上。
      - name: 安装 pyright
        run: npm install --global pyright

      - name: Gate（scripts/check.sh）
        # 与本地完全同一条命令。runner 上没有 `.venv`，脚本回退到 python3（上面已装好依赖）；
        # 本机 `no_proxy` 的 `[::1]` 噪声由 `app/tests/conftest.py` 的 autouse fixture 摘掉，
        # 所以 CI 与本机都不需要再写 `env -u ...`。
        run: ./scripts/check.sh
