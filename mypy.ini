; mypy 配置（仓库根，唯一一份）
;
; 为什么放在仓库根而不是 app/pyproject.toml：pi-lens 与本机都把检查器从**仓库根**调起，
; mypy 只从 cwd 往上找配置；放 app/ 下时它找不到，于是既没有 venv 也没有包路径，
; 会对每个第三方 import 报 import-not-found（实测如此）。
;
; python_executable 指向本仓的 .venv：依赖（fastapi / pydantic / uvicorn / pytest / httpx2）装在那里。
; 若换了虚拟环境位置，改这一行即可。
[mypy]
python_version = 3.11
python_executable = .venv/bin/python
mypy_path = app
files = app/worksplice, app/tests
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
warn_unused_configs = True
