; mypy 配置（仓库根，唯一一份）
;
; 为什么放在仓库根：mypy 只从 cwd 往上找配置。本仓把配置放这里，任何 cwd 都能命中同一份，
; 不必在多个目录重复同一组规则。
;
; 为什么设 ignore_missing_imports：pi-lens 用**它自己**的 mypy（与本仓 .venv 隔离）逐文件检查，
; 那个解释器看不到 fastapi / pydantic / pytest，会把第三方 import 判成 import-not-found。
; 这是检查器环境的差异，不是本仓代码的问题。权威检查是 `.venv/bin/python -m mypy`
; （见 README），它跑在装了依赖的解释器上，真做类型检查；ignore_missing_imports 只影响
; 找不到 stub 的第三方包，不影响本仓自身类型的检查强度。
;
; 不要把 python_executable 写成相对路径：mypy 是按 **cwd** 而不是配置文件位置解析它的，
; 于是 `.venv/bin/python` 在仓库根可用、在 app/ 下失效（反之亦然），逐目录写法只会漂移。
;
; 同理，下面的 `files = app/alibot, app/tests` 也是相对 **cwd** 解析的：**必须在仓库根跑**
; （`scripts/check.sh` 就是这么跑的）。在 `app/` 下跑会把两个目录都当成顶层包，报
; `Duplicate module named "__main__"`——那是检查器路由的假象，不是代码回归。
[mypy]
python_version = 3.11
mypy_path = app
files = app/alibot, app/tests
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
warn_unused_configs = True
