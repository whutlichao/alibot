<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>alibot · 协作工作区</title>
<!--
  alibot 工作台 · Vue 版（`/studio/v2/`）

  与旧页面（`/studio/index.html`）**共用**同一批资产，一条都不复制。这里刻意用**绝对路径**
  而不是相对路径：Vite 只处理它自己能解析成项目内模块的引用，绝对 URL 原样保留，
  于是构建产物里这四行一个字节都不变，两版页面读的仍是同一份文件。

    /design/colors_and_type.css   设计系统 foundation（颜色 / 字号）——只读挂载
    /design/tokens.css            设计系统 foundation（间距 / 半径 / 布局 / 动效）
    /studio/product-tokens.css    产品扩展层（--selected* / --unread* / --warn*）
    /studio/app.css               组件样式（每个类名的唯一实现）

  于是「视觉契约」仍然只有一个正本：两版页面消费同一批 token 名与同一份组件样式，
  重构不会顺手改掉任何一处色位或尺寸。

  两个 classic script 也必须先加载（它们是**唯一实现**，不是副本）：
    /studio/i18n.js       词条表（ADR-0009 第一层；Vue 侧只包一层响应式桥，不复制任何词条）
    /studio/markdown.js   消息正文渲染器（ADR-0037；纯函数模块，输入正文与提及区间、输出 DOM 节点）

  加载顺序是硬要求：模块脚本在 DOM 解析后执行，且这两个 classic script 在它之前已经执行完——
  桥接层拿不到它们时会抛一条能定位的错，而不是静默退化成纯文本。
-->
<link rel="stylesheet" href="/design/colors_and_type.css" />
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/studio/product-tokens.css" />
<link rel="stylesheet" href="/studio/app.css" />
  <script type="module" crossorigin src="/studio/v2/assets/index-D_temnDo.js"></script>
</head>
<body>
<div id="app"></div>
<script src="/studio/i18n.js"></script>
<script src="/studio/markdown.js"></script>
</body>
</html>
