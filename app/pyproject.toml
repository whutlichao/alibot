[project]
name = "alibot-app"
version = "0.1.0"
description = "Alibot MVP：本机单用户频道协作工作台的后端（HTTP 人类面）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  # AgentScope：进程内驱动 Agent 的框架。**pin 到文档站点当前版本 2.0.10**
  # （2026-10-18 核对 docs.agentscope.io → /en/versions/2.0.10；PyPI 最新同为 2.0.10）。
  # 只用 2.x API（agentscope.agent.Agent / agentscope.model / agentscope.credential）。
  "agentscope==2.0.10",
  # 各 provider 的 HTTP 客户端：AgentScope 把它们做成可选 extra，这里显式安装本票支持的
  # 全部 provider（DashScope / Moonshot / DeepSeek / Volcengine / MiniMax 走 openai 客户端）。
  "openai>=1.0",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "xai-sdk>=1.0",
  "ollama>=0.5.4",
  # Docker 工作区后端（#150）：AgentScope 把 aiodocker 放在 extra `workspace-docker`；
  # 这里显式 pin 研究 #134 实测过的版本，否则新机器上 DockerWorkspace.initialize() 在
  # import 阶段就 ModuleNotFoundError。
  "aiodocker==0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=2.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alibot"]

[tool.hatch.build.targets.sdist]
include = ["alibot", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
# 本仓的文档、注释与界面文案是简体中文（AGENTS.md），全角标点是刻意写法而非误输。
extend-ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

# 类型检查配置在仓库根的 mypy.ini / pyrightconfig.json：pi-lens 与编辑器都以仓库根为
# cwd 运行检查器，放在这里它们会找不到（且散两份会漂移）。

# pi-lens / ruff 的 "ambiguous punctuation"（RUF001–003）规则会给中文注释与文档串报满屏
# warning，与「代码检查必须干净」冲突。按 implement 的前置约定在仓库本地配置里关掉这条规则；
# 关闭不影响任何交付行为。对应 [tool.ruff.lint].extend-ignore。
